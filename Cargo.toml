[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Mike Smullin <mike@smullindesign.com>"]

[workspace.dependencies]
anyhow = "1.0.100"
ndarray = "0.16.1"
ort = "2.0.0-rc.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokenizers = { version = "0.21.4", default-features = false, features = ["onig"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
rustfft = "6.4.1"
ndarray-npy = { version = "0.9.1", features = ["npz"] }
hound = "3.5.1"
regex = "1.12.3"
cpal = "0.18.2"
serde_yaml = "0.9.34"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
webrtc-vad = "0.4.0"
signal-hook = "0.4.6"
