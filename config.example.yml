# perception-voice configuration
# Copy this file to config.yml before running the server.
# All fields are required.

server:
  # Unix domain socket path (relative to workspace root, or absolute path)
  socket_path: "perception.sock"
  
  # How long to retain transcriptions in memory (minutes)
  buffer_retention_minutes: 30
  
  # Phrases to discard (Whisper hallucinates these from coughs/sneezes)
  # Matching is case-insensitive and alphanumeric-only
  discard_phrases:
    - "thank you"
    - "thanks"
    - "you"

  # Optional append-only log of everything overheard, one
  # timestamp-prefixed line per utterance, with a P95 loudness tag to
  # help tell speakers apart (`Sun, Sep 6 @ 4:09p | P95 -23dB | ...`).
  # null or "" = disabled (in-memory buffer only). When set, every
  # buffered utterance is appended to this file, so the full history
  # survives beyond buffer_retention_minutes and restarts.
  # Relative paths anchor at this config file's directory.
  # Example: "./tmp/convos.md" or "/var/log/perception-voice.log"
  transcript_log_path: null

audio:
  # Sample rate for audio capture (Hz)
  sample_rate: 16000
  
  # Audio buffer size (samples per chunk)
  # Silero VAD requires at least 512 samples
  buffer_size: 512
  
  # Microphone device index (null for auto-detect)
  mic_device: null
  
  # Minimum duration of speech to transcribe (seconds)
  min_utterance_duration: 1.1
  
  # Silence duration before finalizing transcription (seconds)
  post_speech_silence_duration: 0.6
  
  # Buffer duration before speech detection (seconds)
  pre_recording_buffer_duration: 1.0

transcription:
  # STT backend:
  #   "local"  — faster-whisper on this machine (model/device/etc below)
  #   "muse"   — Meta Muse Voice Transcribe hosted API (see `muse:` block
  #              below). Loads NOTHING on the GPU — frees all VRAM. VAD
  #              stays local, so only detected speech is sent to Meta.
  #   "audio8" — Audio8-ASR-0.1B, tiny local open-weight model (see
  #              `audio8:` block; requires the [audio8] extra).
  backend: "local"

  # Model for transcription (downloaded automatically on first startup)
  # Options: tiny, tiny.en, base, base.en, small, small.en, medium, medium.en, large-v2, large-v3
  model: "large-v3"
  
  # Compute device: "cpu" or "cuda" (for GPU acceleration)
  device: "cuda"
  
  # Compute type: "int8" (CPU), "float16" (GPU recommended), "float32"
  compute_type: "float16"
  
  # Language code (e.g., "en", "es", "fr", "de", "zh")
  language: "en"
  
  # Beam size for transcription (higher = more accurate, slower)
  beam_size: 5

vad:
  # WebRTC sensitivity (0-3, higher = less sensitive to noise)
  webrtc_sensitivity: 3
  
  # Silero sensitivity (0.0-1.0, lower = more sensitive)
  silero_sensitivity: 0.05
  
  # Use ONNX for faster Silero inference on CPU
  silero_use_onnx: true

realtime:
  # Secondary small model that decodes the in-progress utterance every
  # `interval` seconds, pushing partial hypotheses to `subscribe words`
  # subscribers (Ada). The main model above still produces the final text.
  enabled: true
  model: "tiny.en"
  device: "cuda"
  compute_type: "float16"
  interval: 0.5
  beam_size: 1

muse:
  # Meta Muse Voice Transcribe (used when transcription.backend: "muse").
  # Docs: https://ai.developer.meta.com/docs/speech-to-text
  # Pricing: $3.00 / 1,000 audio min; only VAD-detected speech is sent.

  # API key ("LLM|..."). null = read META_API_KEY from the environment;
  # an uncommitted .env file next to config.yml is loaded automatically.
  api_key: null

  model: "muse-voice-transcribe-1.0"

  # true:  one realtime WebSocket per utterance — live partials feed
  #        `subscribe words`, final lands ~0.16s after end of speech.
  # false: buffered WAV POSTed after each utterance (no partials).
  streaming: true

  realtime_url: "wss://api.meta.ai/v1/asr/realtime"
  transcribe_url: "https://api.meta.ai/v1/asr/transcribe"

  # Optional recognition biasing
  language_bias: []
  keywords: []

  # Seconds to wait on API calls / final transcript before falling back
  request_timeout: 30.0

audio8:
  # Audio8-ASR-0.1B (used when transcription.backend: "audio8").
  # Requires `pip install transformers` (or `uv pip install -e '.[audio8]'`).
  # Weights download from Hugging Face on first startup. CC-BY-NC-4.0.
  model: "Audio8/Audio8-ASR-0.1B"
  device: "cuda"        # "cuda" or "cpu"
  dtype: "bfloat16"     # "bfloat16" (GPU) or "float32" (CPU)
  max_new_tokens: 128
  max_clip_seconds: 30  # model cap; longer utterances are chunked
