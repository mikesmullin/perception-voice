# perception-voice (Rust) configuration
# Copy to config.yml before running the server.
#
# Fields the Python build used that no longer apply here
# (transcription.model/device/compute_type/beam_size, the realtime: and muse:
# blocks) are accepted and ignored, so one file can front either build while
# you switch over.

server:
  # Unix domain socket. Relative paths anchor at this file's directory.
  socket_path: "perception.sock"

  # How long utterances stay queryable (minutes).
  buffer_retention_minutes: 30

  # Phrases to drop. Whisper-family models hallucinate these from coughs and
  # breaths. Matching is case-insensitive, alphanumerics only.
  discard_phrases:
    - "thank you"
    - "thanks"
    - "you"

  # Append-only log of everything overheard: one timestamped line per
  # utterance with a P95 loudness tag, so history outlives the in-memory TTL.
  # null or "" disables it.
  transcript_log_path: "./tmp/convos.md"

audio:
  # 16 kHz is required: both the VAD and the ASR encoder are fixed at it.
  sample_rate: 16000

  # Samples per chunk. Silero needs exactly 512 at 16 kHz.
  buffer_size: 512

  # Substring matched against input device names. null takes the system
  # default, re-resolved on every open so it follows `set-default-source`.
  mic_device: null

  # Utterances shorter than this are discarded as noise (seconds).
  min_utterance_duration: 1.1

  # Trailing silence that ends an utterance (seconds). This, not decode time,
  # is what dominates perceived dictation latency.
  post_speech_silence_duration: 0.6

  # Audio retained before speech is detected, so the first syllable is not
  # clipped (seconds).
  pre_recording_buffer_duration: 1.0

vad:
  # WebRTC aggressiveness, 0-3. It runs first and short-circuits, so at 3 it
  # also rejects quiet speech before Silero gets a say. Lower this before
  # suspecting the model if speech is being missed on a quiet microphone.
  webrtc_sensitivity: 3

  # Silero speech probability threshold, 0.0-1.0. Lower is more sensitive.
  silero_sensitivity: 0.05

  # false leaves WebRTC as the only gate: cheaper, markedly more
  # trigger-happy on noise.
  silero_enabled: true

  # Path to silero_vad.onnx. null looks for vad/silero_vad.onnx next to the
  # ASR bundle directory.
  silero_model_path: null

audio8:
  # ONNX bundle directory. null uses $AUDIO8_ASR_BUNDLE, else
  # ~/.cache/audio8-asr-onnx/model_bundle.
  bundle_dir: null

  # Generation cap per pass. This also sets how long a single pass may be:
  # the LM's KV cache holds 512 slots total, audio costs ~1 slot per 1280
  # samples, and anything longer is split into chunks and rejoined.
  max_new_tokens: 128

  # ONNX Runtime intra-op threads. 0 uses all available cores.
  threads: 0
