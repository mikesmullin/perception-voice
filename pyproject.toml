[project]
name = "perception-voice"
version = "0.1.0"
description = "System-level speech-to-text service with shared GPU model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mike Smullin", email = "mike@smullindesign.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["transcription", "audio", "speech-to-text", "systemd", "ipc"]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "faster-whisper>=0.10.0",
    "pyyaml>=6.0.0",
    "webrtcvad-wheels>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Audio8-ASR-0.1B local backend (transcription.backend: "audio8");
# librosa/soundfile are imported by the model's trust_remote_code files.
# transformers must stay <5: the model's remote code produces garbage
# under 5.x (untied lm_head + changed generation internals) — verified
# broken on 5.16.1, working on 4.57.6.
audio8 = ["transformers>=4.44,<5", "librosa>=0.10", "soundfile>=0.12"]

[project.scripts]
perception-voice = "perception_voice.cli:main"

[project.urls]
Homepage = "https://github.com/mikesmullin/perception-voice"
Repository = "https://github.com/mikesmullin/perception-voice"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["perception_voice*"]
